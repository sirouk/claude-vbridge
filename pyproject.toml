[project]
name = "claude-vbridge"
version = "0.2.0"
description = "OAuth-protected local tools for Claude remote MCP connectors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "pillow>=11",
    "uvicorn>=0.54.0",
]

[project.scripts]
vbridge = "vbridge.server:main"
vbridge-worker = "vbridge.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vbridge"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
